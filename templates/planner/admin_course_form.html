{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <span class="eyebrow">پنل مدیر</span>
        <h1>{{ title }}</h1>
    </div>
</div>

<div class="card narrow">
    <form method="post" class="stack-form">
        {% csrf_token %}
        {% for field in form %}
            {% if field.name == 'prerequisites' %}
            <label>
                {{ field.label }}
                {{ field }}
                {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
                {% if field.errors %}
                    <ul class="form-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
                {% endif %}
            </label>
            {% else %}
            <label>
                {{ field.label }}
                {% if field.field.widget.input_type == 'checkbox' %}
                    <div class="checkbox-wrap">
                        {{ field }}
                    </div>
                {% else %}
                    {{ field }}
                {% endif %}
                {% if field.errors %}
                    <ul class="form-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
                {% endif %}
            </label>
            {% endif %}
        {% endfor %}
        <button class="button primary" type="submit">ذخیره</button>
    </form>
</div>
{% endblock %}
