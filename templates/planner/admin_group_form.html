{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <span class="eyebrow">پنل مدیر</span>
        <h1>{{ title }}</h1>
    </div>
</div>

<div class="card narrow">
    <form method="post" class="stack-form">
        {% csrf_token %}
        {% for field in form %}
            <label>
                {{ field.label }}
                {{ field }}
                {% if field.errors %}
                    <ul class="form-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
                {% endif %}
            </label>
        {% endfor %}
        <button class="button primary" type="submit">ذخیره</button>
    </form>
</div>
{% endblock %}
